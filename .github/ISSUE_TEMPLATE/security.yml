name: Security Vulnerability Report
description: Report a security vulnerability (public template - for sensitive reports, email security@zeaz.io)
labels: [security]
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ IMPORTANT:** For sensitive security vulnerabilities, please DO NOT use this form.
        Instead, email [security@zeaz.io](mailto:security@zeaz.io) directly.
        
        This template is for non-sensitive security reports or follow-ups to private disclosures.
  - type: dropdown
    id: severity
    attributes:
      label: Severity Level
      description: What is the perceived severity of this vulnerability?
      options:
        - Critical (remote code execution, authentication bypass)
        - High (privilege escalation, data exposure)
        - Medium (limited impact, requires specific conditions)
        - Low (minimal impact, informational)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Vulnerability Description
      description: Describe the security vulnerability.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
      description: What could an attacker achieve by exploiting this?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps to reproduce the vulnerability.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Suggested Mitigation
      description: Do you have any suggestions for fixing this issue?
