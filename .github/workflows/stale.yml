name: Stale

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  stale:
    name: Close Stale Issues and PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          # General settings
          days-before-stale: 60
          days-before-close: 14
          
          # Issue settings
          stale-issue-label: 'status: stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. 
            It will be closed if no further activity occurs within 14 days. 
            
            If you believe this issue is still relevant, please leave a comment or update the issue.
          close-issue-message: |
            This issue was closed because it has been inactive for 14 days since being marked as stale.
            Please reopen if you would like to discuss this further.
          exempt-issue-labels: 'priority: critical,priority: high,status: in progress,type: security'
          
          # PR settings
          stale-pr-label: 'status: stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity. 
            It will be closed if no further activity occurs within 14 days.
            
            If you are still working on this PR, please leave a comment to keep it active.
          close-pr-message: |
            This PR was closed because it has been inactive for 14 days since being marked as stale.
            Please reopen when you're ready to continue.
          exempt-pr-labels: 'priority: critical,priority: high,status: in progress'
          
          # Additional settings
          operations-per-run: 50
          remove-stale-when-updated: true
          ascending: true
