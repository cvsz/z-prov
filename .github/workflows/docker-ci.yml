name: Docker Image CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Dockerfile*'
      - 'compose.yaml'
      - '.dockerignore'
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile*'
      - 'compose.yaml'
      - '.dockerignore'

jobs:
  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.control, Dockerfile.web, Dockerfile.sandbox-egress]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.dockerfile }}
        run: |
          docker build \
            --file ${{ matrix.dockerfile }} \
            --tag test-${{ matrix.dockerfile }}:${{ github.sha }} \
            --target final \
            .

      - name: Run security scan
        if: matrix.dockerfile == 'Dockerfile'
        run: |
          echo "Running container security validation..."
          make validate-container || echo "Container validation skipped in CI"

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          docker compose version

      - name: Validate compose file
        run: |
          docker compose config --quiet
          echo "Docker Compose configuration is valid"
