[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "zeaz-control"
version = "0.1.0a1"
description = "Transactional standard control plane for ZeaZ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.117,<0.118",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
zeaz-control = "zeaz_control.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/zeaz_control"]
