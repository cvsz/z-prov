services:
  provider:
    build: .
    image: z-prov/z-prov:0.4.2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/providers.yaml:/app/config/providers.yaml:ro
    ports:
      - "127.0.0.1:${Z_PROV_PORT:-8080}:8080"
    networks:
      - provider
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  provider:
    internal: false
